<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Immich ML Proxy - Debug</title>
    <link rel="stylesheet" href="/shared.css">
    <style>
        /* Capture controls */

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px 20px;
        }

        .control-inline {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .control-label {
            font-size: 13px;
            min-width: 0;
        }

        .control-label strong {
            font-weight: 650;
        }

        #debugStatusLabel {
            text-transform: lowercase;
        }

        .control-inline input[type="number"] {
            width: 84px;
        }

        .controls-actions {
            margin-left: auto;
        }

        /* Switch */

        .switch {
            position: relative;
            display: inline-block;
            flex: none;
            width: 44px;
            height: 26px;
        }

        .switch input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            margin: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #c4cfdd;
            border-radius: 999px;
            pointer-events: none;
            transition: background-color 0.15s ease;
        }

        .slider::before {
            content: "";
            position: absolute;
            top: 3px;
            left: 3px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.15s ease;
        }

        .switch input:checked + .slider {
            background: var(--accent);
        }

        .switch input:checked + .slider::before {
            transform: translateX(18px);
        }

        .switch input:focus-visible + .slider {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* Filters */

        .filter-grid {
            display: grid;
            gap: 8px 10px;
            grid-template-columns: minmax(0, 2.2fr) repeat(3, minmax(0, 1fr));
        }

        /* Trace list */

        .trace-list {
            display: grid;
            gap: 8px;
        }

        .trace-item {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 5px;
            min-width: 0;
        }

        .trace-header {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 6px 10px;
            padding: 10px 12px;
        }

        .trace-header.pinned {
            background: #fffdf5;
        }

        .trace-toggle {
            display: grid;
            flex: 1 1 240px;
            gap: 4px;
            min-width: 0;
            padding: 0;
            background: none;
            border: 0;
            color: inherit;
            text-align: left;
            cursor: pointer;
        }

        .trace-topline,
        .trace-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .trace-request,
        .record-route {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 6px;
            min-width: 0;
        }

        .trace-method,
        .record-method {
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        .trace-url,
        .record-url {
            color: var(--text-muted);
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .trace-summary-meta {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
        }

        .trace-time {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* Chips hold server-supplied text, so clip rather than let a long
           content type or error string push the page sideways. */
        .trace-chip,
        .inline-badge {
            display: inline-flex;
            align-items: center;
            max-width: 100%;
            padding: 2px 7px;
            border-radius: var(--radius-sm);
            background: #eef1f5;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 650;
            overflow-wrap: anywhere;
        }

        .trace-chip.id-chip {
            font-family: var(--font-mono);
            font-weight: 500;
        }

        .trace-details {
            display: none;
            padding: 10px 12px 12px;
            background: var(--panel-muted);
            border-top: 1px solid var(--border);
        }

        .trace-details.show {
            display: block;
        }

        .trace-flow {
            display: grid;
            gap: 8px;
        }

        /* Record cards */

        .record-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 10px;
            min-width: 0;
        }

        .record-card-header {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: space-between;
            gap: 6px 10px;
            margin-bottom: 8px;
        }

        .record-card-main {
            display: grid;
            flex: 1 1 200px;
            gap: 4px;
            min-width: 0;
        }

        .record-title,
        .record-card-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .record-type {
            display: inline-flex;
            align-items: center;
            padding: 2px 7px;
            border-radius: var(--radius-sm);
            background: #eef1f5;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .record-type.incoming {
            background: var(--success-bg);
            color: var(--success-text);
        }

        .record-type.outgoing {
            background: var(--info-bg);
            color: var(--info-text);
        }

        .record-sections {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr));
        }

        .detail-section {
            background: var(--panel-muted);
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 8px;
            min-width: 0;
        }

        .detail-section h4 {
            margin-bottom: 6px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
        }

        .detail-section > * + * {
            margin-top: 8px;
        }

        .error-block {
            padding: 8px 10px;
            margin-bottom: 8px;
            background: var(--error-bg);
            border: 1px solid #f0c2c0;
            border-radius: 5px;
            color: var(--error-text);
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .inline-alert {
            padding: 8px 10px;
            background: var(--warning-bg);
            border: 1px solid #e8d09a;
            border-radius: 5px;
            color: var(--warning-text);
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .meta-grid {
            display: grid;
            gap: 6px;
            grid-template-columns: repeat(auto-fit, minmax(min(130px, 100%), 1fr));
        }

        .meta-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 5px;
            padding: 6px 8px;
            min-width: 0;
        }

        .meta-card .label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
        }

        .meta-card .value {
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .code-block,
        .preview-block,
        .body-placeholder,
        .multipart-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 5px;
            min-width: 0;
        }

        .code-block pre,
        .preview-block pre {
            margin: 0;
            padding: 8px 10px;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            color: var(--text);
        }

        .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 5px 10px;
            border-bottom: 1px solid var(--border);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-muted);
        }

        .body-placeholder {
            padding: 8px 10px;
            color: var(--text-muted);
            font-size: 12px;
            overflow-wrap: anywhere;
        }

        .multipart-grid {
            display: grid;
            gap: 8px;
        }

        .multipart-card {
            padding: 8px;
        }

        .multipart-title,
        .multipart-meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px;
        }

        .multipart-meta {
            margin: 6px 0;
        }

        .multipart-name {
            font-weight: 650;
            overflow-wrap: anywhere;
        }

        .mono {
            font-family: var(--font-mono);
        }

        /* Responsive */

        @media (max-width: 900px) {
            .filter-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .filter-grid .field-search {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 720px) {
            .controls-actions {
                width: 100%;
                margin-left: 0;
            }

            .controls-actions .btn {
                flex: 1 1 auto;
            }

            .trace-summary-meta {
                width: 100%;
                margin-left: 0;
                justify-content: space-between;
            }

            .record-card-meta {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <main class="content">
            <div id="notice" class="notice" role="status" aria-live="polite"></div>

            <section class="panel" aria-label="Capture controls">
                <div class="controls">
                    <div class="control-inline" title="Capture inbound requests and downstream calls.">
                        <label class="switch" for="debugToggle">
                            <input type="checkbox" id="debugToggle" role="switch" aria-label="Toggle debug capture">
                            <span class="slider" aria-hidden="true"></span>
                        </label>
                        <span class="control-label">Debug <strong id="debugStatusLabel">Disabled</strong></span>
                    </div>
                    <div class="control-inline" title="Hide /ping health-check requests from the trace list.">
                        <label class="switch" for="filterPingToggle">
                            <input type="checkbox" id="filterPingToggle" role="switch" aria-label="Toggle /ping filtering" checked>
                            <span class="slider" aria-hidden="true"></span>
                        </label>
                        <span class="control-label" id="filterPingLabel">Ping filter</span>
                    </div>
                    <div class="control-inline">
                        <label class="control-label" for="maxRecords">Max records</label>
                        <input type="number" id="maxRecords" min="1" max="10000" value="100" inputmode="numeric">
                    </div>
                    <div class="btn-row controls-actions">
                        <button id="refreshButton" class="btn btn-primary" type="button">Refresh</button>
                        <button id="pauseButton" class="btn btn-secondary" type="button" aria-pressed="false" disabled>Pause</button>
                        <button id="clearButton" class="btn btn-danger" type="button">Clear</button>
                    </div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <div>
                        <h2 class="panel-title">Filters</h2>
                        <p class="panel-subtitle">Search matches trace ID, method, route, backend URL, and error text.</p>
                    </div>
                </div>
                <div class="filter-grid">
                    <div class="field field-search">
                        <label for="searchFilter">Search</label>
                        <input type="search" id="searchFilter" placeholder="Trace ID, route, backend URL, error" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
                    </div>
                    <div class="field">
                        <label for="statusFilter">Status</label>
                        <select id="statusFilter">
                            <option value="all">All</option>
                            <option value="error">Failed</option>
                            <option value="success">Completed</option>
                            <option value="pending">Pending</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="payloadFilter">Payload</label>
                        <select id="payloadFilter">
                            <option value="all">Any</option>
                            <option value="multipart">Multipart</option>
                            <option value="binary">Binary</option>
                            <option value="json">JSON</option>
                            <option value="text">Text</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="scopeFilter">Scope</label>
                        <select id="scopeFilter">
                            <option value="all">All</option>
                            <option value="pinned">Pinned</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="stat-bar" aria-label="Debug summary">
                <div class="stat">
                    <span class="stat-value" id="visibleTraceCount">0</span>
                    <span class="stat-label">Traces</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="visibleEventCount">0</span>
                    <span class="stat-label">Events</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="failedTraceCount">0</span>
                    <span class="stat-label">Failed</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="pinnedTraceCount">0</span>
                    <span class="stat-label">Pinned</span>
                </div>
            </section>

            <section class="panel" aria-labelledby="traceExplorerTitle">
                <div class="panel-header">
                    <div>
                        <h2 id="traceExplorerTitle" class="panel-title">Traces</h2>
                        <p class="panel-subtitle">Pinned traces stay on top. Open a trace to inspect every hop.</p>
                    </div>
                    <span id="resultSummary" class="status-note" aria-live="polite"></span>
                </div>
                <div id="loading" class="loading">Refreshing…</div>
                <div id="records" class="trace-list" aria-live="polite"></div>
            </section>
        </main>
    </div>

    <script src="/shared.js"></script>
    <script>
        const state = {
            records: [],
            recordsSignature: '',
            lastRefresh: null,
            loading: false,
            autoRefreshPaused: false,
            filters: {
                search: '',
                status: 'all',
                payload: 'all',
                scope: 'all'
            }
        };

        let latestStatus = {
            enabled: false,
            maxRecords: 100,
            recordCount: 0
        };

        let autoRefreshInterval = null;

        const noticeMgr = createNoticeManager();
        const expandedTraces = new Set();
        const pinnedTraces = new Set();
        const refs = {};

        document.addEventListener('DOMContentLoaded', init);

        function init() {
            renderShellHeader('debug', {
                title: 'Debug traces',
                statusHTML: '<span id="debugModePill" class="status-pill warning">Debug Disabled</span>'
                    + '<span id="refreshSummary" class="status-note">Waiting for the first refresh.</span>'
            });

            refs.notice = document.getElementById('notice');
            refs.debugToggle = document.getElementById('debugToggle');
            refs.debugModePill = document.getElementById('debugModePill');
            refs.debugStatusLabel = document.getElementById('debugStatusLabel');
            refs.filterPingToggle = document.getElementById('filterPingToggle');
            refs.refreshSummary = document.getElementById('refreshSummary');
            refs.maxRecords = document.getElementById('maxRecords');
            refs.refreshButton = document.getElementById('refreshButton');
            refs.pauseButton = document.getElementById('pauseButton');
            refs.clearButton = document.getElementById('clearButton');
            refs.searchFilter = document.getElementById('searchFilter');
            refs.statusFilter = document.getElementById('statusFilter');
            refs.payloadFilter = document.getElementById('payloadFilter');
            refs.scopeFilter = document.getElementById('scopeFilter');
            refs.visibleTraceCount = document.getElementById('visibleTraceCount');
            refs.visibleEventCount = document.getElementById('visibleEventCount');
            refs.failedTraceCount = document.getElementById('failedTraceCount');
            refs.pinnedTraceCount = document.getElementById('pinnedTraceCount');
            refs.resultSummary = document.getElementById('resultSummary');
            refs.loading = document.getElementById('loading');
            refs.records = document.getElementById('records');

            bindEvents();
            render();
            refreshDashboard({ showLoading: true, preserveNotice: true });
        }

        function bindEvents() {
            refs.debugToggle.addEventListener('change', toggleDebug);
            refs.filterPingToggle.addEventListener('change', toggleFilterPing);
            refs.maxRecords.addEventListener('change', updateMaxRecords);
            refs.refreshButton.addEventListener('click', () => refreshDashboard({ showLoading: true, preserveNotice: true }));
            refs.pauseButton.addEventListener('click', togglePause);
            refs.clearButton.addEventListener('click', clearRecords);

            refs.searchFilter.addEventListener('input', event => {
                state.filters.search = event.target.value;
                render();
            });
            refs.statusFilter.addEventListener('change', event => {
                state.filters.status = event.target.value;
                render();
            });
            refs.payloadFilter.addEventListener('change', event => {
                state.filters.payload = event.target.value;
                render();
            });
            refs.scopeFilter.addEventListener('change', event => {
                state.filters.scope = event.target.value;
                render();
            });

            refs.records.addEventListener('click', handleTraceActions);
        }

        function showNotice(message, type, opts) {
            noticeMgr.showNotice(message, type, opts);
        }

        function hideNotice() {
            noticeMgr.hideNotice();
        }

        function setLoading(isLoading) {
            state.loading = isLoading;
            refs.loading.classList.toggle('show', isLoading);
            refs.records.setAttribute('aria-busy', isLoading ? 'true' : 'false');
        }

        async function refreshDashboard({ showLoading = true, preserveNotice = false } = {}) {
            if (showLoading) {
                setLoading(true);
            }

            try {
                const [statusResponse, recordsResponse] = await Promise.all([
                    fetch('/api/debug/status'),
                    fetch('/api/debug/records')
                ]);

                if (!statusResponse.ok) {
                    throw new Error('Failed to load debug status');
                }
                if (!recordsResponse.ok) {
                    throw new Error('Failed to load debug records');
                }

                latestStatus = await statusResponse.json();

                // Re-rendering identical data would drop text selection and
                // scroll position on every poll, so only render on change.
                const records = await recordsResponse.json();
                const signature = JSON.stringify(records);
                const recordsChanged = signature !== state.recordsSignature;
                if (recordsChanged) {
                    state.recordsSignature = signature;
                    state.records = records;
                }

                state.lastRefresh = new Date();

                syncStatusControls();

                if (recordsChanged) {
                    render();
                }

                if (!preserveNotice) {
                    showNotice('Debug data refreshed.', 'success');
                } else if (refs.notice.classList.contains('error')) {
                    hideNotice();
                }
            } catch (error) {
                syncStatusControls();
                render();
                showNotice(error.message, 'error', { persist: true });
            } finally {
                setLoading(false);
            }
        }

        function syncStatusControls() {
            refs.debugToggle.checked = Boolean(latestStatus.enabled);
            refs.filterPingToggle.checked = latestStatus.filterPing !== false;
            refs.maxRecords.value = String(latestStatus.maxRecords || 100);

            if (latestStatus.enabled) {
                refs.debugModePill.textContent = 'Debug Enabled';
                refs.debugModePill.className = 'status-pill success';
                refs.debugStatusLabel.textContent = 'Enabled';
            } else {
                refs.debugModePill.textContent = 'Debug Disabled';
                refs.debugModePill.className = 'status-pill warning';
                refs.debugStatusLabel.textContent = 'Disabled';
            }

            updateAutoRefreshState();
            updateRefreshSummary();
        }

        function updateRefreshSummary() {
            if (!latestStatus.enabled) {
                refs.refreshSummary.textContent = 'Debug capture is off.';
                return;
            }

            if (state.autoRefreshPaused) {
                refs.refreshSummary.textContent = state.lastRefresh
                    ? `Auto-refresh paused. Last refresh: ${formatTimestamp(state.lastRefresh.toISOString())}.`
                    : 'Auto-refresh paused before the first refresh.';
                return;
            }

            refs.refreshSummary.textContent = state.lastRefresh
                ? `Auto-refresh every 2s. Last refresh: ${formatTimestamp(state.lastRefresh.toISOString())}.`
                : 'Waiting for the first refresh.';
        }

        function updateAutoRefreshState() {
            const shouldPoll = latestStatus.enabled && !state.autoRefreshPaused;

            refs.pauseButton.disabled = !latestStatus.enabled;
            refs.pauseButton.setAttribute('aria-pressed', state.autoRefreshPaused ? 'true' : 'false');
            refs.pauseButton.textContent = state.autoRefreshPaused ? 'Resume' : 'Pause';

            if (shouldPoll) {
                startAutoRefresh();
                return;
            }

            stopAutoRefresh();
        }

        async function toggleDebug() {
            const enabled = refs.debugToggle.checked;

            try {
                const response = await fetch('/api/debug/toggle', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ enabled })
                });

                if (!response.ok) {
                    throw new Error('Failed to update debug mode');
                }

                latestStatus.enabled = enabled;
                syncStatusControls();
                showNotice(`Debug capture ${enabled ? 'enabled' : 'disabled'}.`, 'success');
                if (enabled) {
                    refreshDashboard({ showLoading: true, preserveNotice: true });
                }
            } catch (error) {
                refs.debugToggle.checked = !enabled;
                syncStatusControls();
                showNotice(error.message, 'error', { persist: true });
            }
        }

        async function toggleFilterPing() {
            const filterPing = refs.filterPingToggle.checked;

            try {
                const response = await fetch('/api/debug/filter-ping', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filterPing })
                });

                if (!response.ok) {
                    throw new Error('Failed to update /ping filter');
                }

                latestStatus.filterPing = filterPing;
                showNotice(`/ping filtering ${filterPing ? 'enabled' : 'disabled'}.`, 'success');
            } catch (error) {
                refs.filterPingToggle.checked = !filterPing;
                showNotice(error.message, 'error', { persist: true });
            }
        }

        async function updateMaxRecords() {
            const maxRecords = Number.parseInt(refs.maxRecords.value, 10);
            if (!Number.isFinite(maxRecords) || maxRecords < 1 || maxRecords > 10000) {
                showNotice('Max records must be between 1 and 10000.', 'error');
                refs.maxRecords.value = String(latestStatus.maxRecords || 100);
                return;
            }

            try {
                const response = await fetch('/api/debug/max-records', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ maxRecords })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to update max records');
                }

                latestStatus.maxRecords = maxRecords;
                showNotice(`Max records updated to ${maxRecords}.`, 'success');
            } catch (error) {
                refs.maxRecords.value = String(latestStatus.maxRecords || 100);
                showNotice(error.message, 'error', { persist: true });
            }
        }

        function togglePause() {
            state.autoRefreshPaused = !state.autoRefreshPaused;
            updateAutoRefreshState();
            updateRefreshSummary();

            showNotice(
                state.autoRefreshPaused ? 'Auto-refresh paused. Manual refresh is still available.' : 'Auto-refresh resumed.',
                'info'
            );
        }

        async function clearRecords() {
            if (!window.confirm('Clear all recorded debug traces?')) {
                return;
            }

            try {
                const response = await fetch('/api/debug/records', { method: 'DELETE' });
                if (!response.ok) {
                    throw new Error('Failed to clear debug records');
                }

                expandedTraces.clear();
                pinnedTraces.clear();
                state.records = [];
                state.recordsSignature = '';
                render();
                showNotice('All debug records cleared.', 'success');
                refreshDashboard({ showLoading: false, preserveNotice: true });
            } catch (error) {
                showNotice(error.message, 'error', { persist: true });
            }
        }

        function startAutoRefresh() {
            if (autoRefreshInterval) {
                return;
            }

            autoRefreshInterval = setInterval(() => {
                refreshDashboard({ showLoading: false, preserveNotice: true });
            }, 2000);
        }

        function stopAutoRefresh() {
            if (!autoRefreshInterval) {
                return;
            }

            clearInterval(autoRefreshInterval);
            autoRefreshInterval = null;
        }

        function handleTraceActions(event) {
            const button = event.target.closest('button[data-action]');
            if (!button) {
                return;
            }

            const traceId = button.dataset.traceId;
            if (!traceId) {
                return;
            }

            if (button.dataset.action === 'toggle-trace') {
                if (expandedTraces.has(traceId)) {
                    expandedTraces.delete(traceId);
                } else {
                    expandedTraces.add(traceId);
                }
                render();
                return;
            }

            if (button.dataset.action === 'pin-trace') {
                if (pinnedTraces.has(traceId)) {
                    pinnedTraces.delete(traceId);
                } else {
                    pinnedTraces.add(traceId);
                }
                render();
            }
        }

        function render() {
            const allTraces = groupRecordsByTrace(Array.isArray(state.records) ? state.records : []);
            trimTraceState(allTraces);

            const visibleTraces = applyFilters(allTraces);
            const visibleEvents = visibleTraces.reduce((sum, trace) => sum + trace.records.length, 0);
            const failedTraces = allTraces.filter(trace => trace.status.className === 'error').length;

            refs.visibleTraceCount.textContent = String(visibleTraces.length);
            refs.visibleEventCount.textContent = String(visibleEvents);
            refs.failedTraceCount.textContent = String(failedTraces);
            refs.pinnedTraceCount.textContent = String(Array.from(pinnedTraces).filter(traceId => allTraces.some(trace => trace.traceId === traceId)).length);

            refs.resultSummary.textContent = allTraces.length === visibleTraces.length
                ? `${visibleTraces.length} trace(s), ${visibleEvents} event(s)`
                : `${visibleTraces.length} of ${allTraces.length} trace(s) shown`;

            updateRefreshSummary();

            if (allTraces.length === 0) {
                refs.records.innerHTML = '<div class="empty-state">No traces yet. Enable debug capture and send traffic through the proxy to start recording request chains.</div>';
                return;
            }

            if (visibleTraces.length === 0) {
                refs.records.innerHTML = '<div class="empty-state">No traces match the current filters. Widen the search or filter settings to see more.</div>';
                return;
            }

            refs.records.innerHTML = visibleTraces.map(renderTraceCard).join('');
        }

        function trimTraceState(traces) {
            const validTraceIds = new Set(traces.map(trace => trace.traceId));

            for (const traceId of Array.from(expandedTraces)) {
                if (!validTraceIds.has(traceId)) {
                    expandedTraces.delete(traceId);
                }
            }

            for (const traceId of Array.from(pinnedTraces)) {
                if (!validTraceIds.has(traceId)) {
                    pinnedTraces.delete(traceId);
                }
            }
        }

        function groupRecordsByTrace(records) {
            const traceMap = new Map();

            for (const record of records) {
                const traceId = record.traceId || record.id;
                if (!traceMap.has(traceId)) {
                    traceMap.set(traceId, {
                        traceId,
                        records: [],
                        latestTimestamp: record.timestamp,
                        firstTimestamp: record.timestamp
                    });
                }

                const trace = traceMap.get(traceId);
                trace.records.push(record);

                if (!trace.latestTimestamp || new Date(record.timestamp) > new Date(trace.latestTimestamp)) {
                    trace.latestTimestamp = record.timestamp;
                }
                if (!trace.firstTimestamp || new Date(record.timestamp) < new Date(trace.firstTimestamp)) {
                    trace.firstTimestamp = record.timestamp;
                }
            }

            return Array.from(traceMap.values())
                .map(trace => {
                    trace.records.sort((left, right) => {
                        const leftOrder = left.type === 'incoming' ? 0 : 1;
                        const rightOrder = right.type === 'incoming' ? 0 : 1;
                        if (leftOrder !== rightOrder) {
                            return leftOrder - rightOrder;
                        }
                        return new Date(left.timestamp) - new Date(right.timestamp);
                    });

                    trace.rootRecord = trace.records.find(record => record.type === 'incoming') || trace.records[0];
                    trace.outgoingCount = trace.records.filter(record => record.type === 'outgoing').length;
                    trace.status = getTraceStatus(trace.records);
                    return trace;
                })
                .sort((left, right) => new Date(left.firstTimestamp) - new Date(right.firstTimestamp));
        }

        function applyFilters(traces) {
            const search = state.filters.search.trim().toLowerCase();

            return traces
                .filter(trace => {
                    if (state.filters.scope === 'pinned' && !pinnedTraces.has(trace.traceId)) {
                        return false;
                    }

                    if (state.filters.status !== 'all' && trace.status.className !== state.filters.status) {
                        return false;
                    }

                    if (!matchesPayloadFilter(trace, state.filters.payload)) {
                        return false;
                    }

                    if (!search) {
                        return true;
                    }

                    return buildTraceSearchText(trace).includes(search);
                })
                .sort((left, right) => {
                    const leftPinned = pinnedTraces.has(left.traceId) ? 1 : 0;
                    const rightPinned = pinnedTraces.has(right.traceId) ? 1 : 0;
                    if (leftPinned !== rightPinned) {
                        return rightPinned - leftPinned;
                    }
                    return new Date(left.firstTimestamp) - new Date(right.firstTimestamp);
                });
        }

        function buildTraceSearchText(trace) {
            const tokens = [trace.traceId];

            for (const record of trace.records) {
                tokens.push(
                    record.id,
                    record.type,
                    record.error,
                    record.request?.method,
                    record.request?.url,
                    record.request?.body?.kind,
                    record.request?.body?.contentType,
                    record.response?.body?.kind,
                    record.response?.body?.contentType
                );
            }

            return tokens.filter(Boolean).join(' ').toLowerCase();
        }

        function matchesPayloadFilter(trace, filter) {
            if (filter === 'all') {
                return true;
            }

            const bodies = [];
            for (const record of trace.records) {
                if (record.request?.body) {
                    bodies.push(record.request.body);
                }
                if (record.response?.body) {
                    bodies.push(record.response.body);
                }
            }

            switch (filter) {
                case 'multipart':
                    return bodies.some(body => body.kind === 'multipart');
                case 'binary':
                    return bodies.some(body => body.kind === 'binary');
                case 'json':
                    return bodies.some(body => body.kind === 'json');
                case 'text':
                    return bodies.some(body => body.kind === 'text' || body.kind === 'xml');
                default:
                    return true;
            }
        }

        function getTraceStatus(records) {
            if (records.some(record => record.error)) {
                return { className: 'error', text: 'Error' };
            }

            const responseStatuses = records
                .filter(record => record.response && typeof record.response.statusCode === 'number' && record.response.statusCode > 0)
                .map(record => record.response.statusCode);

            if (responseStatuses.some(status => status >= 400)) {
                return { className: 'error', text: 'Response Error' };
            }

            if (records.every(record => record.response && typeof record.response.statusCode === 'number' && record.response.statusCode > 0)) {
                return { className: 'success', text: 'Complete' };
            }

            return { className: 'pending', text: 'Pending' };
        }

        function getRecordStatus(record) {
            if (record.error) {
                return { className: 'error', text: 'Error' };
            }

            if (record.response && typeof record.response.statusCode === 'number' && record.response.statusCode > 0) {
                if (record.response.statusCode >= 400) {
                    return { className: 'error', text: String(record.response.statusCode) };
                }
                return { className: 'success', text: String(record.response.statusCode) };
            }

            return { className: 'pending', text: 'Pending' };
        }

        function renderTraceCard(trace) {
            const root = trace.rootRecord || {};
            const request = root.request || {};
            const isExpanded = expandedTraces.has(trace.traceId);
            const isPinned = pinnedTraces.has(trace.traceId);
            const traceId = escapeHtml(trace.traceId);
            const detailId = `details-${traceId}`;

            return `
                <article class="trace-item">
                    <div class="trace-header ${isPinned ? 'pinned' : ''}">
                        <button
                            type="button"
                            class="trace-toggle"
                            data-action="toggle-trace"
                            data-trace-id="${traceId}"
                            aria-expanded="${isExpanded ? 'true' : 'false'}"
                            aria-controls="${detailId}"
                        >
                            <span class="trace-topline">
                                <span class="trace-status ${trace.status.className}">${trace.status.text}</span>
                                <span class="trace-chip id-chip">${traceId}</span>
                                ${isPinned ? '<span class="trace-chip">Pinned</span>' : ''}
                            </span>
                            <span class="trace-request">
                                <span class="trace-method">${escapeHtml(request.method || '-')}</span>
                                <span class="trace-url">${escapeHtml(request.url || '(unknown route)')}</span>
                            </span>
                            <span class="trace-meta">
                                <span class="trace-chip">${pluralize(trace.records.length, 'event')} · ${trace.outgoingCount} downstream</span>
                                ${renderTraceBodyChip(root)}
                            </span>
                        </button>
                        <div class="trace-summary-meta">
                            <span class="trace-time">${formatTimestamp(trace.latestTimestamp)}</span>
                            <button
                                type="button"
                                class="btn btn-ghost btn-sm"
                                data-action="pin-trace"
                                data-trace-id="${traceId}"
                                aria-pressed="${isPinned ? 'true' : 'false'}"
                            >
                                ${isPinned ? 'Unpin' : 'Pin'}
                            </button>
                        </div>
                    </div>
                    <div id="${detailId}" class="trace-details ${isExpanded ? 'show' : ''}">
                        <div class="trace-flow">
                            ${trace.records.map(renderRecordCard).join('')}
                        </div>
                    </div>
                </article>
            `;
        }

        function renderTraceBodyChip(record) {
            if (!record || !record.request || !record.request.body) {
                return '';
            }

            const body = record.request.body;
            if (!body.size) {
                return '<span class="trace-chip">Empty body</span>';
            }

            return `<span class="trace-chip">${escapeHtml(body.kind || 'body')} · ${formatBytes(body.size)}</span>`;
        }

        function renderRecordCard(record) {
            const status = getRecordStatus(record);
            const hasResponse = record.response && typeof record.response.statusCode === 'number' && record.response.statusCode > 0;

            return `
                <div class="record-card">
                    <div class="record-card-header">
                        <div class="record-card-main">
                            <div class="record-title">
                                <span class="record-type ${escapeHtml(record.type)}">${escapeHtml(record.type)}</span>
                                <span class="record-status ${status.className}">${escapeHtml(status.text)}</span>
                                ${renderStatusCodeChip(record.response?.statusCode)}
                            </div>
                            <div class="record-route">
                                <span class="record-method">${escapeHtml(record.request?.method || '-')}</span>
                                <span class="record-url">${escapeHtml(record.request?.url || '(unknown route)')}</span>
                            </div>
                        </div>
                        <div class="record-card-meta">
                            <span class="trace-chip id-chip">${escapeHtml(record.id || '')}</span>
                            <span class="trace-time">${formatTimestamp(record.timestamp)}</span>
                        </div>
                    </div>

                    ${record.error ? `<div class="error-block">${escapeHtml(record.error)}</div>` : ''}

                    <div class="record-sections">
                        <div class="detail-section">
                            <h4>Request</h4>
                            ${renderHeaders(record.request?.headers)}
                            ${renderBodyInfo(record.request?.body)}
                        </div>
                        <div class="detail-section">
                            <h4>Response</h4>
                            ${hasResponse
                                ? `${renderResponseMeta(record.response)}${renderHeaders(record.response?.headers)}${renderBodyInfo(record.response?.body)}`
                                : '<div class="body-placeholder">No response recorded yet.</div>'}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderStatusCodeChip(statusCode) {
            if (typeof statusCode !== 'number' || statusCode <= 0) {
                return '';
            }

            const className = statusCode >= 400 ? 'error' : 'success';
            return `<span class="status-code ${className}">Response ${statusCode}</span>`;
        }

        function renderResponseMeta(response) {
            if (!response || typeof response.statusCode !== 'number' || response.statusCode <= 0) {
                return '<div class="body-placeholder">No response recorded yet.</div>';
            }

            return `
                <div class="meta-grid">
                    <div class="meta-card">
                        <div class="label">Status Code</div>
                        <div class="value">${response.statusCode}</div>
                    </div>
                </div>
            `;
        }

        function renderHeaders(headers) {
            if (!headers || Object.keys(headers).length === 0) {
                return '<div class="body-placeholder">Headers are empty.</div>';
            }

            const lines = Object.entries(headers)
                .sort(([left], [right]) => left.localeCompare(right))
                .map(([key, value]) => `${key}: ${value}`)
                .join('\n');

            return `
                <div class="code-block">
                    <div class="preview-header">Headers</div>
                    <pre>${escapeHtml(lines)}</pre>
                </div>
            `;
        }

        function renderBodyInfo(body) {
            if (!body) {
                return '<div class="body-placeholder">Body metadata is unavailable.</div>';
            }

            const summary = [
                renderMetaCard('Kind', body.kind || 'unknown'),
                renderMetaCard('Content-Type', body.contentType || '(unknown)'),
                renderMetaCard('Size', `${formatBytes(body.size || 0)} (${body.size || 0} B)`),
                renderMetaCard('MD5', body.md5 || '(none)', true)
            ].join('');

            let extra = '';
            if (body.error) {
                extra += `<div class="inline-alert">Body summary error: ${escapeHtml(body.error)}</div>`;
            }
            if (body.preview) {
                extra += `
                    <div class="preview-block">
                        <div class="preview-header">
                            <span>Preview</span>
                            ${body.truncated ? '<span class="inline-badge">Truncated</span>' : ''}
                        </div>
                        <pre>${escapeHtml(body.preview)}</pre>
                    </div>
                `;
            }
            if (body.multipart) {
                extra += renderMultipart(body.multipart);
            }
            if (!body.preview && !body.multipart) {
                extra += `<div class="body-placeholder">${escapeHtml(body.summary || 'No preview available for this body.')}</div>`;
            }

            return `
                <div class="meta-grid">${summary}</div>
                ${extra}
            `;
        }

        function renderMetaCard(label, value, mono = false) {
            const valueClass = mono ? 'value mono' : 'value';
            return `
                <div class="meta-card">
                    <div class="label">${escapeHtml(label)}</div>
                    <div class="${valueClass}">${escapeHtml(String(value))}</div>
                </div>
            `;
        }

        function renderMultipart(multipart) {
            const fieldCards = (multipart.fields || []).map(field => `
                <div class="multipart-card">
                    <div class="multipart-title">
                        <span class="multipart-name">${escapeHtml(field.name)}</span>
                        <span class="inline-badge">Field</span>
                    </div>
                    <div class="multipart-meta">
                        <span class="inline-badge">${formatBytes(field.size || 0)}</span>
                        ${field.contentType ? `<span class="inline-badge">${escapeHtml(field.contentType)}</span>` : ''}
                        ${field.md5 ? `<span class="inline-badge mono">${escapeHtml(field.md5)}</span>` : ''}
                        ${field.truncated ? '<span class="inline-badge">Truncated</span>' : ''}
                    </div>
                    ${field.preview ? `<div class="preview-block"><pre>${escapeHtml(field.preview)}</pre></div>` : '<div class="body-placeholder">Empty field value.</div>'}
                </div>
            `).join('');

            const fileCards = (multipart.files || []).map(file => `
                <div class="multipart-card">
                    <div class="multipart-title">
                        <span class="multipart-name">${escapeHtml(file.name)}</span>
                        <span class="inline-badge">File</span>
                    </div>
                    <div class="multipart-meta">
                        ${file.filename ? `<span class="inline-badge">${escapeHtml(file.filename)}</span>` : ''}
                        ${file.contentType ? `<span class="inline-badge">${escapeHtml(file.contentType)}</span>` : ''}
                        <span class="inline-badge">${formatBytes(file.size || 0)}</span>
                    </div>
                    <div class="meta-grid">
                        ${renderMetaCard('Filename', file.filename || '(none)')}
                        ${renderMetaCard('Content-Type', file.contentType || '(unknown)')}
                        ${renderMetaCard('Size', `${formatBytes(file.size || 0)} (${file.size || 0} B)`)}
                        ${renderMetaCard('MD5', file.md5 || '(none)', true)}
                    </div>
                </div>
            `).join('');

            return `
                <div class="multipart-grid">
                    ${fieldCards}
                    ${fileCards}
                </div>
            `;
        }

        function pluralize(count, noun) {
            return `${count} ${noun}${count === 1 ? '' : 's'}`;
        }

        function formatTimestamp(timestamp) {
            if (!timestamp) {
                return '-';
            }

            return new Date(timestamp).toLocaleString();
        }

        function formatBytes(bytes) {
            if (!bytes) {
                return '0 B';
            }

            const units = ['B', 'KB', 'MB', 'GB'];
            let value = bytes;
            let unitIndex = 0;
            while (value >= 1024 && unitIndex < units.length - 1) {
                value /= 1024;
                unitIndex++;
            }

            const precision = unitIndex === 0 ? 0 : 2;
            return `${value.toFixed(precision)} ${units[unitIndex]}`;
        }

        function escapeHtml(value) {
            const text = value == null ? '' : String(value);
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
